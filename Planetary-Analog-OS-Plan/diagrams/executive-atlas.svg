<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Planetary Analog OS executive atlas</title>
  <desc id="desc">A visual plan showing the path from a mission question through measurable terrain evidence, transfer gaps, a study protocol, observed outcomes, and an international planetary analog infrastructure layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0A1118"/>
      <stop offset="1" stop-color="#162A31"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#38B5C5"/><stop offset="1" stop-color="#9be4e9"/></linearGradient>
    <linearGradient id="mars" x1="0" x2="1"><stop stop-color="#A8513A"/><stop offset="1" stop-color="#D38C69"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#38B5C5"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1390" cy="120" r="220" fill="#38B5C5" opacity=".07"/>
  <circle cx="1380" cy="120" r="135" fill="none" stroke="#38B5C5" opacity=".18"/>
  <path d="M1180 120h400M1380 -80v400" stroke="#38B5C5" opacity=".09"/>
  <text x="100" y="95" fill="#9be4e9" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">PLANETARY ANALOG OS / STRATEGY ATLAS</text>
  <text x="100" y="160" fill="#F4F0E8" font-family="Georgia,serif" font-size="58">From resemblance to evidence.</text>
  <text x="100" y="208" fill="#B7C5C8" font-family="Arial,sans-serif" font-size="22">TerraTrace v0.1 is the first auditable nucleus, not the finished operating system.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="310" width="270" height="150" rx="16" fill="#17252C" stroke="#38B5C5"/>
    <rect x="410" y="310" width="270" height="150" rx="16" fill="#17252C" stroke="#38B5C5"/>
    <rect x="720" y="310" width="270" height="150" rx="16" fill="#17252C" stroke="#A8513A"/>
    <rect x="1030" y="310" width="270" height="150" rx="16" fill="#17252C" stroke="#D6A33A"/>
    <rect x="1340" y="310" width="170" height="150" rx="16" fill="#17252C" stroke="#4C8B69"/>
  </g>

  <g fill="#F4F0E8" font-family="Arial,sans-serif">
    <text x="130" y="355" font-size="15" fill="#9be4e9">01 / QUESTION</text>
    <text x="130" y="390" font-size="25">Mission</text>
    <text x="130" y="420" font-size="17" fill="#B7C5C8">What must the study</text>
    <text x="130" y="443" font-size="17" fill="#B7C5C8">actually establish?</text>

    <text x="440" y="355" font-size="15" fill="#9be4e9">02 / OBSERVABLE</text>
    <text x="440" y="390" font-size="25">Requirement</text>
    <text x="440" y="420" font-size="17" fill="#B7C5C8">Slope, relief, support,</text>
    <text x="440" y="443" font-size="17" fill="#B7C5C8">quality, uncertainty</text>

    <text x="750" y="355" font-size="15" fill="#D38C69">03 / COMPARISON</text>
    <text x="750" y="390" font-size="25">Terrain units</text>
    <text x="750" y="420" font-size="17" fill="#B7C5C8">Mars reference ↔ Earth</text>
    <text x="750" y="443" font-size="17" fill="#B7C5C8">at common support</text>

    <text x="1060" y="355" font-size="15" fill="#E4C36E">04 / LIMIT</text>
    <text x="1060" y="390" font-size="25">Transfer gaps</text>
    <text x="1060" y="420" font-size="17" fill="#B7C5C8">What Earth cannot</text>
    <text x="1060" y="443" font-size="17" fill="#B7C5C8">reproduce or prove</text>

    <text x="1368" y="355" font-size="15" fill="#8FCA9B">05 / NEXT</text>
    <text x="1368" y="390" font-size="23">Study</text>
    <text x="1368" y="420" font-size="17" fill="#B7C5C8">Protocol</text>
    <text x="1368" y="443" font-size="17" fill="#B7C5C8">+ evidence</text>
  </g>

  <g stroke="url(#cyan)" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M370 385h35"/><path d="M680 385h35"/><path d="M990 385h35"/><path d="M1300 385h35"/>
  </g>

  <rect x="100" y="555" width="1410" height="205" rx="18" fill="#101B21" stroke="#30454D"/>
  <text x="135" y="605" fill="#9be4e9" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">THE COMPOUNDING ASSET</text>
  <text x="135" y="655" fill="#F4F0E8" font-family="Georgia,serif" font-size="36">Verified Transfer Records</text>
  <text x="135" y="698" fill="#B7C5C8" font-family="Arial,sans-serif" font-size="19">pre-test requirement  +  source evidence  +  protocol  +  observed outcome  +  residual gap</text>
  <text x="135" y="735" fill="#B7C5C8" font-family="Arial,sans-serif" font-size="19">The interface is copyable. The reviewed evidence history and governance network are the long-term moat.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="830" width="430" height="90" rx="12" fill="#182B2E"/>
    <rect x="585" y="830" width="430" height="90" rx="12" fill="#222B30"/>
    <rect x="1070" y="830" width="440" height="90" rx="12" fill="#302329"/>
  </g>
  <g font-family="Arial,sans-serif">
    <text x="130" y="868" fill="#8FCA9B" font-size="16">NOW / COMPETITION NUCLEUS</text>
    <text x="130" y="897" fill="#F4F0E8" font-size="18">Map-scale morphology audit</text>
    <text x="615" y="868" fill="#E4C36E" font-size="16">NEXT / INSTITUTIONAL PRODUCT</text>
    <text x="615" y="897" fill="#F4F0E8" font-size="18">Study workspaces + outcomes</text>
    <text x="1100" y="868" fill="#D38C69" font-size="16">LATER / INFRASTRUCTURE</text>
    <text x="1100" y="897" fill="#F4F0E8" font-size="18">Standards + governed network</text>
  </g>
  <text x="100" y="970" fill="#789096" font-family="Arial,sans-serif" font-size="15">No valuation is promised. Scale is unlocked by evidence, adoption, outcomes, and legitimacy.</text>
</svg>
