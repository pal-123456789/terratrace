site_name: TerraTrace - Planetary Analog OS
site_description: Mars-vs-Earth map-scale terrain-morphology transfer audit
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - content.code.copy
docs_dir: docs
nav:
  - Home: index.md
  - Method: method.md
  - Validation & ablations: VALIDATION.md
  - Limitations & claim firewall: limitations.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
