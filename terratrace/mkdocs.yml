site_name: TerraTrace - Planetary Analog OS
site_description: Five-world map-scale terrain-morphology analog screening, with a benchmark that withdraws its own false analog (v3 pre-specified, not fully pre-registered)
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - content.code.copy
docs_dir: docs
nav:
  - Home: index.md
  - Method: method.md
  - Validation & ablations: VALIDATION.md
  - Benchmark protocol v3 (frozen): BENCHMARK-PROTOCOL-v3.md
  - Benchmark results v3: RESULTS-v3.md
  - V3 archival clarification: V3-ARCHIVAL-CLARIFICATION.md
  - Independent-toolchain reproduction: INDEPENDENT-GIS-REPRODUCTION.md
  - Lunar demonstration (exploratory): LUNAR-DEMONSTRATION.md
  - Lunar status & the data blocker: LUNAR-STATUS.md
  - External-user walkthrough: WALKTHROUGH.md
  - Event-window contribution: EVENT-WINDOW-CONTRIBUTION.md
  - Benchmark protocol v2: BENCHMARK-PROTOCOL-v2.md
  - Benchmark results v2: RESULTS-v2.md
  - Benchmark protocol v1: BENCHMARK-PROTOCOL.md
  - Benchmark v3 proposal (superseded): BENCHMARK-PROTOCOL-v3-PROPOSAL.md
  - Real worked example (exploratory, superseded): REAL-EXAMPLE.md
  - Claim-to-evidence ledger: CLAIM-LEDGER.md
  - Analog atlas: ATLAS.md
  - Limitations & claim firewall: limitations.md
  - Feature definitions & units: FEATURES.md
  - Accessibility report: ACCESSIBILITY.md
  - Event eligibility evidence: event/eligibility-evidence.md
  - Master-plan traceability: PLAN-COMPLIANCE.md
  - Demo script: DEMO.md
  - Paper: PAPER.md
  - Typeset paper (PDF): TerraTrace-paper.pdf
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
