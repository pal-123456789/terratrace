# Lunar panel — the independent-axis probe (protocol v1)
#
# FROZEN BEFORE THE RECORDED RUN. Nothing in this file is tuned to the numbers it produces; the two
# places where a pilot run influenced the design are marked `pilot_disclosed` and say what changed
# and why. Everything else was fixed on principle before any measurement was read.
#
# WHAT THIS PROTOCOL IS FOR
# -------------------------
# The lunar panel is one-dimensional: the three declared axes span a single dimension at every
# support (terratrace/dependence.py, artifacts/dependence/dependence_audit.json). Every other
# limitation of the lunar half is downstream of that one. This protocol attacks it directly, in the
# only way that can produce an honest answer: it asks what the three axes can and cannot see, looks
# for a bank descriptor that carries information they do not, and then -- the part that matters --
# tests whether a better axis would even change the decision.

name: lunar_axis_probe_v1
status: EXPLORATORY SENSITIVITY PROBE
declared_before_the_recorded_run: true
what_this_is: >-
  A sensitivity probe on the 18 cells of the already-published lunar panel v2. It does not modify
  that panel, its protocol, its artifact or its numbers.
what_this_is_not: >-
  Not a new panel. Not a pre-registration. Not independent confirmation. The same 18 cells were
  examined in v2 before this probe existed, so no result here may be described as confirmatory.

reference_axes: [mean_slope_deg, mean_relief3_m, elev_std_m]
candidate_pool: >-
  every finite numeric scalar returned by terratrace.descriptors.descriptor_bank(z, dx=support,
  window=5) -- the engine's own 192-scalar geomorphometric bank, summarised as a flat bag
footprint_m: 9000
supports_m: [500.0, 750.0, 1000.0]
sites: [Site01, Site04, Site07, Site11, Site20, Site23]
earth_candidates: 7
cells: 18                      # 6 sites x 3 supports
units_per_cell: 8              # the reference plus the 7 Earth candidates -- the frontier's own pool

# ---------------------------------------------------------------------------- the estimate
statistic:
  name: adjusted_r2
  definition: >-
    Per cell, the descriptor is regressed on the three declared axes over the cell's 8 units by
    ordinary least squares, and R2 is adjusted for the number of fitted parameters.
  why_adjusted: >-
    With n = 8 units and p = 3 predictors a RAW R2 has a chance level of p/(n-1) = 3/7 = 0.4286, so
    a raw-R2 threshold of 0.5 sits barely above pure noise. Adjusted R2 has expectation ~0 under the
    null, which makes the threshold interpretable.
  chance_level_raw_r2: 0.4285714285714286
  cell_definition: (support, site) with the site as the reference

admissibility:
  # A descriptor must VARY across the units being compared, or its R2 is measuring round-off.
  # pilot_disclosed: the first version ranked on R2 alone and put /spectral/peak_wavelength_m first
  # with a median raw R2 of -1.15 -- a descriptor that is constant across units, where R2 is
  # undefined rather than low. The criterion below was added because of that, and the failure is
  # recorded in the artifact rather than hidden.
  min_within_cell_cv: 0.10
  min_admissible_cells: 16     # out of 18
  near_zero_mean_guard: 0.10   # |mean| must exceed 10% of the RMS, else the CV is a denominator
                               # artefact. A non-negative quantity always clears this: rms/mean is at
                               # most sqrt(n) = 2.83, so |mean|/rms >= 0.354. A signed descriptor
                               # centred on zero does not, which is correct -- "variation relative to
                               # the mean" is not a defined quantity there.

classification:
  non_redundant_if_median_adjusted_r2_at_most: 0.0
  partially_independent_if_median_adjusted_r2_at_most: 0.25

circular_exclusions:
  # Honest, and load-bearing: the probe must not "discover" an axis that cannot be used.
  - key: /anisotropy/orientation_deg
    reason: >-
      A circular quantity measured in degrees. 359 deg and 1 deg are adjacent but numerically far,
      so a Euclidean Pareto distance on it is meaningless. It is reportable as a finding and not
      admissible as an axis.

# ---------------------------------------------------------------------------- the two controls
invariance_test:
  # The analytic half. What can the three axes see AT ALL? A plane family has a free parameter --
  # azimuth -- and if the three axes are invariant under a transformation of it, they are provably
  # blind to that dimension.
  family: z = g * (x*cos(theta) + y*sin(theta))
  gradient_g: 0.30
  n: 18
  dx_m: 500.0
  operations: [theta_plus_90, ninety_minus_theta, theta_plus_180, theta_plus_45]
  tolerance_absolute: 1.0e-9
  predicted_invariant: [theta_plus_90, ninety_minus_theta, theta_plus_180]
  predicted_not_invariant: [theta_plus_45]
  why: >-
    mean_slope_deg and elev_std_m cannot depend on azimuth at fixed gradient magnitude, and
    mean_relief3_m depends on it only through the bounded symmetric factor rho(theta) =
    |cos| + |sin| from the dependence audit, which is invariant under a quarter turn and under
    reflection about the diagonal, and not under a 45 degree rotation.
  consequence: >-
    The declared axes are exactly blind to a quarter-turn rotation of a planar surface. A descriptor
    that is not invariant under it carries information the axes do not -- on planar terrain, as a
    matter of proof rather than measurement.

frontier_test:
  # The consequence half. Adding a coordinate to a Pareto comparison can only ever PROMOTE a
  # co-winner; it can never remove one. So a removal is a machinery failure, not a finding, and the
  # driver asserts it never happens.
  added_axis_distance: >-
    |x_u - x_ref| normalised by the within-cell range of that descriptor across the cell's 8 units.
  why_not_the_engine_normalisation: >-
    The panel's own fractional distance divides by the REFERENCE value, which is undefined when that
    value is 0. The NaN audit below shows 13 of the 184 bank descriptors hit exactly that, so the
    engine's normalisation cannot be used for an arbitrary added axis.
  assert_no_removals: true
  count_changed_cells: true

random_control:
  # The control that decides how the frontier result may be read. A 3-axis Pareto frontier over 8
  # units is expected to be fragile when a 4th coordinate arrives -- ANY 4th coordinate. Without
  # this, "the frontier changed" would be presented as a property of the descriptor.
  construction: a uniformly random 4th coordinate per unit, same range normalisation
  draws: 300
  seed0: 20000
  report: [mean, median, p05, p95, fraction_of_draws_changing_at_least_10, fraction_unchanged]

nan_audit:
  # Reported because it is a latent defect in the engine's own axis construction, not in this probe.
  what: >-
    For every bank descriptor, count the cells in which the ENGINE-STYLE fractional distance to the
    reference is undefined because the reference value is exactly 0.
  finding_expected: >-
    All three declared axes are strictly positive so the declared panel is unaffected, but any
    compositional fraction that can be 0 (a landform class absent from a window) makes the whole
    Pareto comparison silently NaN the moment it is added as an axis.
  record_the_list: true

decision_relevance:
  # A descriptor is decision-relevant beyond arbitrary coordinates only if it moves the frontier
  # further than the random control's upper tail does.
  threshold: greater_than_random_control_p95

outputs:
  artifact: artifacts/lunar_axis_probe/lunar_axis_probe.json
  doc: docs/AXIS-PROBE.md
