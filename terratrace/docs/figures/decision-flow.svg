<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 548" width="1120" height="548" role="img" aria-label="The decision logic: a comparability gate that can refuse, a Pareto ranking that cannot be collapsed into a score, an adequacy band calibrated from the reference itself that is demoted when it admits known-different terrain, and a sufficiency verdict reported separately. Three answers to three questions, never merged.">
<rect width="1120" height="548" fill="#FFFFFF"/>
<text x="30.0" y="36.0" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#24292F" text-anchor="start" font-weight="700">What the engine answers — and the four places it refuses instead</text>
<rect x="30" y="70" width="300" height="46" rx="7" fill="#FBF7FF" stroke="#8250DF" stroke-width="1.4"/>
<text x="180.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8250DF" text-anchor="middle">1 · Are the units comparable?</text>
<text x="180.0" y="109.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">same support, valid coverage, not degenerate</text>
<rect x="700" y="70" width="390" height="46" rx="7" fill="#FCF3F3" stroke="#B4232A" stroke-width="1.4"/>
<text x="895.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#B4232A" text-anchor="middle">BLOCKED / NOT COMPARABLE</text>
<text x="895.0" y="109.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">no verdict is issued, and the reason is named</text>
<rect x="30" y="150" width="300" height="46" rx="7" fill="#FBF7FF" stroke="#8250DF" stroke-width="1.4"/>
<text x="180.0" y="172.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8250DF" text-anchor="middle">2 · Which candidate is least dissimilar?</text>
<text x="180.0" y="189.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">Pareto dominance over the declared axes</text>
<rect x="700" y="150" width="390" height="46" rx="7" fill="#F2FAF9" stroke="#0B7A75" stroke-width="1.4"/>
<text x="895.0" y="172.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0B7A75" text-anchor="middle">A RANKING — definite, or an honest TIE / indeterminate</text>
<text x="895.0" y="189.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">well defined however weak the field; never a score</text>
<rect x="30" y="230" width="300" height="46" rx="7" fill="#FBF7FF" stroke="#8250DF" stroke-width="1.4"/>
<text x="180.0" y="252.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8250DF" text-anchor="middle">3 · Can a band be calibrated at all?</text>
<text x="180.0" y="269.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">the reference's own held-out sub-windows, 95th pct</text>
<rect x="700" y="230" width="390" height="46" rx="7" fill="#FCF3F3" stroke="#B4232A" stroke-width="1.4"/>
<text x="895.0" y="252.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#B4232A" text-anchor="middle">ADEQUACY NOT ESTABLISHED</text>
<text x="895.0" y="269.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">no yardstick exists at this support — reported, not guessed</text>
<rect x="30" y="310" width="300" height="46" rx="7" fill="#FBF7FF" stroke="#8250DF" stroke-width="1.4"/>
<text x="180.0" y="332.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8250DF" text-anchor="middle">4 · Does the band admit different terrain?</text>
<text x="180.0" y="349.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">the five sibling lunar sites are the controls</text>
<rect x="700" y="310" width="390" height="46" rx="7" fill="#FCF3F3" stroke="#B4232A" stroke-width="1.4"/>
<text x="895.0" y="332.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#B4232A" text-anchor="middle">NOT ESTABLISHED — the yardstick is too permissive</text>
<text x="895.0" y="349.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">membership in it is not evidence of similarity</text>
<rect x="30" y="390" width="300" height="46" rx="7" fill="#FBF7FF" stroke="#8250DF" stroke-width="1.4"/>
<text x="180.0" y="412.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8250DF" text-anchor="middle">5 · Is the evidence enough to say either?</text>
<text x="180.0" y="429.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">candidates, supports, band, ensemble, axes</text>
<rect x="700" y="390" width="390" height="46" rx="7" fill="#FFF8EC" stroke="#B26A00" stroke-width="1.4"/>
<text x="895.0" y="412.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#B26A00" text-anchor="middle">INSUFFICIENT · MARGINAL · SUFFICIENT</text>
<text x="895.0" y="429.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="middle">always reported with its reasons</text>
<line x1="330.0" y1="93.0" x2="698.0" y2="93.0" stroke="#D0D7DE" stroke-width="1.3"/><path d="M698.0,93.0 l-5,-3.2 l0,6.4 z" fill="#D0D7DE"/>
<text x="348.0" y="87.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="start">answer</text>
<text x="180.0" y="134.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="middle">if it can</text>
<line x1="330.0" y1="173.0" x2="698.0" y2="173.0" stroke="#D0D7DE" stroke-width="1.3"/><path d="M698.0,173.0 l-5,-3.2 l0,6.4 z" fill="#D0D7DE"/>
<text x="348.0" y="167.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="start">answer</text>
<text x="180.0" y="214.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="middle">if it can</text>
<line x1="330.0" y1="253.0" x2="698.0" y2="253.0" stroke="#D0D7DE" stroke-width="1.3"/><path d="M698.0,253.0 l-5,-3.2 l0,6.4 z" fill="#D0D7DE"/>
<text x="348.0" y="247.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="start">answer</text>
<text x="180.0" y="294.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="middle">if it can</text>
<line x1="330.0" y1="333.0" x2="698.0" y2="333.0" stroke="#D0D7DE" stroke-width="1.3"/><path d="M698.0,333.0 l-5,-3.2 l0,6.4 z" fill="#D0D7DE"/>
<text x="348.0" y="327.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="start">answer</text>
<text x="180.0" y="374.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="middle">if it can</text>
<line x1="330.0" y1="413.0" x2="698.0" y2="413.0" stroke="#D0D7DE" stroke-width="1.3"/><path d="M698.0,413.0 l-5,-3.2 l0,6.4 z" fill="#D0D7DE"/>
<text x="348.0" y="407.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#57606A" text-anchor="start">answer</text>
<text x="30.0" y="486.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#24292F" text-anchor="start">The four refusals are the point. A ranking is not an adequacy statement, and a definite ranking is not evidence that it means anything:</text>
<text x="30.0" y="502.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#24292F" text-anchor="start">the three answers are computed separately, reported separately, and no code path combines them into a single number.</text>
<text x="30.0" y="530.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" text-anchor="start">Source of truth: terratrace/decision.py (Pareto) · terratrace/adequacy.py (the band) · terratrace/verdicts.py (the three answers, and the demotion rule).</text>
</svg>
