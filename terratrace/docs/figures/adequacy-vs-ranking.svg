<text x="30" y="62.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#57606A">Moon Connecting ridge · real NASA Goddard LOLA 5 m/px · 9 km footprint · 500 m support · against the same 7 Earth candidates and 5 sibling lunar sites</text>
<text x="30" y="78.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606A">one of the 18 site x support cells the panel answers at, and one of the only 6 where both descriptor bands can be calibrated</text>
