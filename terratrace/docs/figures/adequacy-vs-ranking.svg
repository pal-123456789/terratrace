<text x="721" y="139.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" letter-spacing="1.4">RANKING</text>
<text x="721" y="163.0" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#0B7A75" font-weight="700">DEFINITE</text>
<text x="721" y="182.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606A">18 of 18 site x support cells</text>
<text x="721.0" y="200.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">· nevada basin is the only non-dominated Earth candidate. A ranking,</text>
<text x="732.0" y="212.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">within the roster tested.</text>
<rect x="706" y="258" width="384" height="140" rx="6" fill="none" stroke="#D0D7DE" stroke-width="1"/>
<text x="721" y="281.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" letter-spacing="1.4">ADEQUACY</text>
<text x="721" y="305.0" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#E0913F" font-weight="700">NOT ESTABLISHED</text>
<text x="721" y="324.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606A">18 of 18 site x support cells</text>
<text x="721.0" y="342.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">· The band admits 4 of 5 sites known to be different terrain on both</text>
<text x="732.0" y="354.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">descriptors at this cell, and at least 4 of 5 at every one of the 6 cells</text>
<text x="732.0" y="366.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">where both bands exist, so membership in it is not evidence of</text>
<text x="732.0" y="378.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">similarity.</text>
<rect x="706" y="400" width="384" height="140" rx="6" fill="none" stroke="#D0D7DE" stroke-width="1"/>
<text x="721" y="423.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A" letter-spacing="1.4">SUFFICIENCY</text>
<text x="721" y="447.0" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#8250DF" font-weight="700">MARGINAL</text>
<text x="721" y="466.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606A">7 candidates · 3 supports · effective rank 1</text>
<text x="721.0" y="484.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">· 6 error realisations sampled while an ensemble claim is made</text>
<text x="721.0" y="496.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">· fewer than 30</text>
<text x="721.0" y="508.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">· the axes span a single dimension, so the evidence is one-dimensional</text>
<text x="732.0" y="520.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#57606A">whatever the axis count suggests</text>
<line x1="30" y1="576" x2="1090" y2="576" stroke="#D0D7DE" stroke-width="1"/>
<text x="30" y="602.0" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#24292F">Every Earth candidate is closer to the Moon than the Moon is to itself · and so are 4 of the 5 lunar sites that a lunar geologist would call different terrain.</text>
<text x="30" y="626.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606A">That is why the engine answers the ranking and the adequacy questions separately, and publishes nothing that turns the first into the second. Source: artifacts/lunar_adequacy/lunar_adequacy.json</text>
<text x="30" y="642.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#57606A">(exploratory reanalysis).</text>
</svg>
