[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terratrace"
version = "0.3.0"
description = "TerraTrace (Planetary Analog OS): map-scale terrain-morphology analog screening with matched-footprint falsification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]
keywords = ["mars", "earth-observation", "dem", "geomorphometry", "planetary-science",
            "analog", "reproducibility"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
real = ["rasterio>=1.3", "requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
terratrace = "terratrace.cli:main"
terratrace-api = "terratrace.api:main"

[tool.setuptools]
packages = ["terratrace"]
