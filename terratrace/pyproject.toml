[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terratrace"
version = "0.1.0"
description = "Planetary Analog OS nucleus: Mars-vs-Earth map-scale morphology transfer audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
real = ["rasterio>=1.3", "requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
terratrace = "terratrace.cli:main"
terratrace-api = "terratrace.api:main"

[tool.setuptools]
packages = ["terratrace"]
